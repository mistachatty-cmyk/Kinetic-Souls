name: Kinetic Souls build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.34.6
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck game
        run: pnpm --filter @workspace/kinetic-souls typecheck
      - name: Build game
        env:
          PORT: '3000'
          BASE_PATH: '/'
        run: pnpm --filter @workspace/kinetic-souls build
